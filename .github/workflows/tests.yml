name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12', '13']
        stability: [prefer-lowest, prefer-stable]

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress \
            --with-all-dependencies --with "laravel/framework:^${{ matrix.laravel }}.0"

      # Lowest dependency sets ship PHP 8.5 deprecations in vendor code, so only
      # the stable set is held to a deprecation-free run.
      - name: Run tests
        run: vendor/bin/phpunit --display-deprecations ${{ matrix.stability == 'prefer-stable' && '--fail-on-deprecation' || '' }}
